services:
  mysql:
    image: mysql:8.0
    container_name: couponrush-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: couponrush
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - couponrush-mysql-data:/var/lib/mysql

volumes:
  couponrush-mysql-data: